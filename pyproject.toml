[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-lock-manager"
version = "0.1.0"
description = "Distributed file-locking system for multi-agent Claude Code workflows"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "filelock",
    "typer[all]",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]

[project.scripts]
swarm = "cli:app"

[tool.setuptools.packages.find]
include = ["swarm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
